# Render Blueprint for the TattvaCo API (FastAPI in server/).
# Deploy: Render dashboard -> New -> Blueprint -> pick this repository.
# Values marked `sync: false` are secrets: Render asks for them on the first deploy.
services:
  - type: web
    name: tattvaco-api
    # Docker image (server/Dockerfile): Python 3.12 plus Tesseract OCR and Poppler for scanned
    # uploads. The image runs migrations, then starts the server on $PORT.
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    # Singapore is Render's closest region to the Supabase database (AWS ap-northeast).
    region: singapore
    plan: free
    healthCheckPath: /api/health/
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: '["https://vyomaibytattvaco.vercel.app","http://localhost:5173"]'

      # Database: the Supabase Postgres connection string (Supabase -> Connect -> Session pooler).
      - key: DATABASE_URL
        sync: false

      # Auth: tokens are checked against the project's JWKS (ES256/RS256) or the JWT secret (HS256).
      - key: SUPABASE_URL
        value: https://khhnrwqzxltskergijid.supabase.co
      - key: SUPABASE_JWT_SECRET
        sync: false

      # AI: provider keys live only here, never in the Vercel build.
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false

      # Research: web search limited to approved government / open reference sites
      # (Tavily free plan, 1,000 searches a month). Without it, Wikipedia search still works.
      - key: TAVILY_API_KEY
        sync: false
